  </defs>
  <rect width="100%" height="100%" fill="#FAF7F5" />
  <!-- Minimal Golden Chain -->
  <path d="M 60 40 C 80 150, 220 150, 240 40" fill="none" stroke="url(#goldGrad3)" stroke-width="3" stroke-linecap="round" filter="url(#shadow3)" />
