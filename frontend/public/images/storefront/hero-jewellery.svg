<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="100%" height="100%">
  <defs>
    <!-- Background atmosphere gradient -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FBF8FF" stopOpacity="0" />
      <stop offset="40%" stopColor="#E9D5FF" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#C084FC" stopOpacity="0.85" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="heroGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="35%" stopColor="#F59E0B" />
      <stop offset="70%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="50%" stopColor="#FEF08A" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <!-- Purple Gemstone Gradients -->
    <radialGradient id="gemPurple" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#C084FC" />
      <stop offset="45%" stopColor="#9333EA" />
      <stop offset="85%" stopColor="#581C87" />
      <stop offset="100%" stopColor="#3B0764" />
    </radialGradient>
    <linearGradient id="gemFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.75" />
      <stop offset="30%" stopColor="#E9D5FF" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#3B0764" stopOpacity="0.8" />
    </linearGradient>

    <!-- Crystal Diamond Gradients -->
    <radialGradient id="diamondGlow" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="60%" stopColor="#E0F2FE" />
      <stop offset="100%" stopColor="#94A3B8" />
    </radialGradient>

    <!-- Shadow filters -->
    <filter id="jewelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" floodColor="#3B0764" floodOpacity="0.28" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Ambient Tint -->
  <rect width="100%" height="100%" fill="url(#heroBg)" rx="16" />

  <!-- Decorative Lilac Blossom Clusters (Right & Top Corner) -->
  <g opacity="0.85" filter="url(#softGlow)">
    <!-- Flowers on Top Right -->
    <g transform="translate(640, 60)">
      <circle cx="0" cy="0" r="14" fill="#C084FC" opacity="0.9" />
      <circle cx="-12" cy="10" r="12" fill="#A855F7" opacity="0.8" />
      <circle cx="14" cy="8" r="13" fill="#DDD6FE" opacity="0.9" />
      <circle cx="6" cy="-14" r="11" fill="#9333EA" opacity="0.75" />
      <circle cx="-8" cy="-12" r="10" fill="#E9D5FF" opacity="0.85" />
      <circle cx="0" cy="0" r="4" fill="#FEF08A" />
    </g>
    <g transform="translate(690, 110)">
      <circle cx="0" cy="0" r="16" fill="#A855F7" opacity="0.85" />
      <circle cx="-15" cy="12" r="13" fill="#C084FC" opacity="0.9" />
      <circle cx="12" cy="14" r="14" fill="#9333EA" opacity="0.8" />
      <circle cx="0" cy="0" r="4" fill="#FEF08A" />
    </g>
    <g transform="translate(670, 180)">
      <circle cx="0" cy="0" r="15" fill="#C084FC" opacity="0.8" />
      <circle cx="14" cy="10" r="12" fill="#DDD6FE" opacity="0.9" />
      <circle cx="-10" cy="12" r="14" fill="#9333EA" opacity="0.85" />
      <circle cx="0" cy="0" r="3" fill="#FEF08A" />
    </g>
    <g transform="translate(710, 240)">
      <circle cx="0" cy="0" r="13" fill="#A855F7" opacity="0.75" />
      <circle cx="-10" cy="-10" r="11" fill="#C084FC" opacity="0.85" />
      <circle cx="8" cy="8" r="12" fill="#DDD6FE" opacity="0.9" />
    </g>
  </g>

  <!-- 1. Gold Necklace with Purple Teardrop Gemstone Pendant (Center-Left) -->
  <g filter="url(#jewelShadow)">
    <!-- Fine Gold Chain -->
    <path d="M 120 0 C 180 180, 280 230, 340 230 C 400 230, 500 180, 560 0" fill="none" stroke="url(#heroGold)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,3" />
    <path d="M 120 0 C 180 180, 280 230, 340 230 C 400 230, 500 180, 560 0" fill="none" stroke="#FFFBEB" stroke-width="1" stroke-linecap="round" opacity="0.6" />

    <!-- Gold Bail & Pendant Cap -->
    <path d="M 334 224 L 346 224 L 343 238 L 337 238 Z" fill="url(#heroGold)" />
    <circle cx="340" cy="226" r="4" fill="url(#heroGold)" stroke="#FFFBEB" stroke-width="1" />

    <!-- Gold Teardrop Outer Bezel Setting -->
    <path d="M 340 236 C 358 260, 368 285, 368 305 C 368 328, 355 345, 340 345 C 325 345, 312 328, 312 305 C 312 285, 322 260, 340 236 Z" fill="url(#heroGold)" />
    
    <!-- Purple Teardrop Gemstone -->
    <path d="M 340 242 C 354 263, 363 286, 363 304 C 363 324, 352 339, 340 339 C 328 339, 317 324, 317 304 C 317 286, 326 263, 340 242 Z" fill="url(#gemPurple)" />
    <!-- Facet reflections -->
    <path d="M 340 244 L 358 298 L 340 334 L 322 298 Z" fill="url(#gemFacet)" opacity="0.45" />
    <circle cx="334" cy="275" r="3" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- 2. Pair of Purple Teardrop Earrings (Center-Right) -->
  <!-- Left Earring -->
  <g transform="translate(425, 140)" filter="url(#jewelShadow)">
    <!-- Gold Hook/Hoop -->
    <path d="M 0 0 C 0 -22, 18 -24, 18 -6 C 18 10, 0 16, 0 28" fill="none" stroke="url(#heroGold)" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="28" r="3" fill="url(#heroGold)" />
    <!-- Teardrop Bezel -->
    <path d="M 0 32 C 14 50, 22 70, 22 86 C 22 104, 12 118, 0 118 C -12 118, -22 104, -22 86 C -22 70, -14 50, 0 32 Z" fill="url(#heroGold)" />
    <!-- Gemstone -->
    <path d="M 0 36 C 11 53, 18 71, 18 85 C 18 100, 10 113, 0 113 C -10 113, -18 100, -18 85 C -18 71, -11 53, 0 36 Z" fill="url(#gemPurple)" />
    <path d="M 0 38 L 14 80 L 0 110 L -14 80 Z" fill="url(#gemFacet)" opacity="0.4" />
    <circle cx="-5" cy="65" r="2.5" fill="#FFFFFF" opacity="0.85" />
  </g>

  <!-- Right Earring -->
  <g transform="translate(490, 140)" filter="url(#jewelShadow)">
    <!-- Gold Hook/Hoop -->
    <path d="M 0 0 C 0 -22, 18 -24, 18 -6 C 18 10, 0 16, 0 28" fill="none" stroke="url(#heroGold)" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="28" r="3" fill="url(#heroGold)" />
    <!-- Teardrop Bezel -->
    <path d="M 0 32 C 14 50, 22 70, 22 86 C 22 104, 12 118, 0 118 C -12 118, -22 104, -22 86 C -22 70, -14 50, 0 32 Z" fill="url(#heroGold)" />
    <!-- Gemstone -->
    <path d="M 0 36 C 11 53, 18 71, 18 85 C 18 100, 10 113, 0 113 C -10 113, -18 100, -18 85 C -18 71, -11 53, 0 36 Z" fill="url(#gemPurple)" />
    <path d="M 0 38 L 14 80 L 0 110 L -14 80 Z" fill="url(#gemFacet)" opacity="0.4" />
    <circle cx="-5" cy="65" r="2.5" fill="#FFFFFF" opacity="0.85" />
  </g>

  <!-- 3. Gold Diamond Eternity Ring (Far Right) -->
  <g transform="translate(610, 210) rotate(-22)" filter="url(#jewelShadow)">
    <!-- Ring Band Back -->
    <ellipse cx="0" cy="0" rx="55" ry="34" fill="none" stroke="url(#heroGold)" stroke-width="7" />
    
    <!-- Diamonds / Crystals mounted on Ring Band Front -->
    <g transform="translate(0, 0)">
      <!-- Prongs & Stones -->
      <circle cx="-42" cy="-14" r="7" fill="url(#diamondGlow)" stroke="url(#heroGold)" stroke-width="2" />
      <circle cx="-28" cy="-24" r="7.5" fill="url(#diamondGlow)" stroke="url(#heroGold)" stroke-width="2" />
      <circle cx="-10" cy="-30" r="8" fill="url(#diamondGlow)" stroke="url(#heroGold)" stroke-width="2" />
      <circle cx="10" cy="-30" r="8" fill="url(#diamondGlow)" stroke="url(#heroGold)" stroke-width="2" />
      <circle cx="28" cy="-24" r="7.5" fill="url(#diamondGlow)" stroke="url(#heroGold)" stroke-width="2" />
      <circle cx="42" cy="-14" r="7" fill="url(#diamondGlow)" stroke="url(#heroGold)" stroke-width="2" />
      
      <!-- Sparkle highlights -->
      <circle cx="-28" cy="-25" r="2" fill="#FFFFFF" />
      <circle cx="-10" cy="-31" r="2.5" fill="#FFFFFF" />
      <circle cx="10" cy="-31" r="2.5" fill="#FFFFFF" />
      <circle cx="28" cy="-25" r="2" fill="#FFFFFF" />
    </g>

    <!-- Ring Band Front highlight -->
    <path d="M -54 2 C -30 35, 30 35, 54 2" fill="none" stroke="url(#goldShine)" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
